[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-extension"
version = "0.1.0"
description = "RAGFlow 权限门户与嵌入访问网关 — Slice 1 最小可登录分享页骨架"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    # Slice 8:DB 持久化(SQLAlchemy 2.x ORM,引擎可切 SQLite/MySQL)
    "sqlalchemy>=2.0",
    "pymysql>=1.1",  # 生产 MySQL 驱动(sync);单元测试用 SQLite 无需驱动
    # Slice 14:OIDC SSO 登录(authlib 提供 OIDC discovery/JWT 验证/OAuth2 client)
    "authlib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.3",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["portal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 RAGFlow 实例的集成测试(默认跳过,需 RAGFLOW_BETA_TOKEN 环境变量)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
