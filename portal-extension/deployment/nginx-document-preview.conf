# Issue 85: merge this exact location into the production nginx server block.
# It must remain narrower than /api/v1/documents/ so unrelated RAGFlow APIs
# continue to use the native upstream.
location ~ ^/api/v1/documents/[^/]+/preview$ {
    proxy_pass http://172.17.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
